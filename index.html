<!DOCTYPE html>
<html>
<head>
    <title>Gulali AR Battle Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
    <script>
        function triggerAnimation(actionType) {
            let kudaModel = document.querySelector("#model-kuda");
            let nagaModel = document.querySelector("#model-naga");
            if (actionType === 'attack') {
                if(kudaModel) kudaModel.setAttribute('animation', 'property: position; to: 0 0.5 -1; dur: 200; dir: alternate; loop: 1');
                if(nagaModel) nagaModel.setAttribute('animation', 'property: position; to: 0 0.5 -1; dur: 200; dir: alternate; loop: 1');
            } else if (actionType === 'defend') {
                if(kudaModel) kudaModel.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 400; loop: 1');
                if(nagaModel) nagaModel.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 400; loop: 1');
            } else if (actionType === 'special') {
                if(kudaModel) kudaModel.setAttribute('animation', 'property: scale; to: 1.3 1.3 1.3; dur: 300; dir: alternate; loop: 1');
                if(nagaModel) nagaModel.setAttribute('animation', 'property: scale; to: 1.3 1.3 1.3; dur: 300; dir: alternate; loop: 1');
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            const kartuKuda = document.querySelector('#target-kuda');
            const kartuNaga = document.querySelector('#target-naga');
            if(kartuKuda) { kartuKuda.addEventListener('targetFound', () => { alert("KUDA_DETECTED"); }); }
            if(kartuNaga) { kartuNaga.addEventListener('targetFound', () => { alert("NAGA_DETECTED"); }); }
        });
    </script>

    <a-scene mindar-image="imageTargetSrc: https://raw.githubusercontent.com/alinbatagor-maker/gulali-ar-card/main/targets.mind;" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="gltf-kuda" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Box/glTF/Box.gltf"></a-asset-item>
            <a-asset-item id="gltf-naga" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Box/glTF/Box.gltf"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-kuda" mindar-image-target="targetIndex: 0">
            <a-entity id="model-kuda" gltf-model="#gltf-kuda" position="0 0 0" scale="0.5 0.5 0.5"></a-entity>
            <a-text value="KUDA GULALI" position="-0.5 0.7 0" color="#FF9800" width="3"></a-text>
        </a-entity>

        <a-entity id="target-naga" mindar-image-target="targetIndex: 1">
            <a-entity id="model-naga" gltf-model="#gltf-naga" position="0 0 0" scale="0.5 0.5 0.5"></a-entity>
            <a-text value="NAGA GULALI" position="-0.5 0.7 0" color="#E91E63" width="3"></a-text>
        </a-entity>
    </a-scene>
</body>
</html>
